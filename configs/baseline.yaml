seed: 42

model:
  vocab_size: 16000
  hidden_size: 256
  intermediate_size: 768
  num_hidden_layers: 2
  num_loops: 4
  num_attention_heads: 4
  num_key_value_heads: 2
  head_dim: 64
  max_position_embeddings: 512
  rope_parameters:
    rope_type: default
    rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  attention_dropout: 0.0
  attention_bias: false
  hidden_act: silu
  use_cache: false
  tie_word_embeddings: true

training:
  train_file: data/train.bin
  val_file: data/val.bin
  tokenizer_dir: tokenizer
  output_dir: outputs/baseline
  max_train_tokens: 100000000
  micro_batch_size: 8
  gradient_accumulation_steps: 8
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 150
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 100
  eval_batches: 50
  log_interval: 10
  save_interval: 500
  dtype: float16
  compile: false
