seed: 42

model:
  vocab_size: 16000
  hidden_size: 128
  intermediate_size: 384
  num_hidden_layers: 1
  num_loops: 2
  num_attention_heads: 4
  num_key_value_heads: 2
  head_dim: 32
  max_position_embeddings: 128
  rope_parameters:
    rope_type: default
    rope_theta: 10000.0
  rms_norm_eps: 1.0e-6
  attention_dropout: 0.0
  attention_bias: false
  hidden_act: silu
  use_cache: false
  tie_word_embeddings: true

training:
  train_file: data/train.bin
  val_file: data/val.bin
  tokenizer_dir: tokenizer
  output_dir: outputs/smoke
  max_train_tokens: 1000000
  micro_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 10
  weight_decay: 0.1
  grad_clip: 1.0
  eval_interval: 25
  eval_batches: 10
  log_interval: 5
  save_interval: 50
  dtype: float32
  compile: false
